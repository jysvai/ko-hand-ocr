[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ko-hand-ocr"
version = "0.2.0"
description = "한글·영문 손글씨 한 줄을 읽는 작은 OCR 모델"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.10"
keywords = ["ocr", "handwriting", "korean", "hangul", "trocr"]
# 판독만 할 때 필요한 것. 학습에는 requirements.txt 를 쓴다(numpy 가 더 붙는다).
dependencies = [
    "torch>=2.5",
    "transformers>=4.45",
    "Pillow>=10.0",
]

[project.optional-dependencies]
train = ["numpy>=1.26"]

[project.urls]
Source = "https://github.com/jysvai/ko-hand-ocr"
Issues = "https://github.com/jysvai/ko-hand-ocr/issues"

[tool.setuptools.packages.find]
include = ["kohandocr*"]

[tool.setuptools.package-data]
kohandocr = ["vocab.json", "measured.json"]
