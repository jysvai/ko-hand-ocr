<text class="ink3" x="20" y="454" font-size="10.5">CER 은 고쳐야 하는 글자 수를 정답 글자 수로 나눈 값이다. 자모 닮음과 다른 자다 — '팀'을 '탐'으로 읽으면 자모로는 0.67, CER 로는 1.0 이다.</text>
<text class="ink3" x="20" y="469" font-size="10.5">줄마다 평균 내지 않고 글자를 다 모아 놓고 나눈다. 안 그러면 한 글자 줄과 서른 글자 줄이 같은 무게가 된다.</text>
<text class="ink3" x="20" y="484" font-size="10.5">가로 눈금은 갈래별·길이별 두 장이 같다. 나란히 놓고 봐도 속지 않게.</text>
