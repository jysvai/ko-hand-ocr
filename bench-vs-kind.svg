<text class="ink3" x="20" y="516" font-size="12.5">CER 은 고쳐야 하는 글자 수를 정답 글자 수로 나눈 값이다. 자모 닮음과 다른 자다 — '팀'을 '탐'으로 읽으면 자모로는 0.67,</text>
