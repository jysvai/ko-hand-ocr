<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 378" width="760" height="378" role="img" aria-label="Per-font jamo similarity for ko-hand-ocr v46. Single checkpoint versus four. EastSeaDokdo 86.4 and 88.1 percent, KirangHaerang 92.4 and 92.6, HiMelody 93.2 and 93.2, NanumPenScript 94.0 and 94.2, GamjaFlower 96.9 and 97.0, SingleDay 97.9 and 98.1. Only EastSeaDokdo is below the 90 percent goal.">
