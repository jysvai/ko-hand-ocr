<text class="ink3" x="20" y="683" font-size="10.5">우리 앙상블은 판 셋을 흔들기 셋으로 읽어 한 칸에 판독을 아홉 번 돈다. 크기로 견주려면 '판 하나' 줄을 본다.</text>
