<text class="ink3" x="20" y="1337" font-size="12.5">8GB 카드라 큰 묶음은 카드 밖으로 샌다(32줄 묶음). 샌 값은 모델이 아니라 이 노트북을 잰 것이라 골라 뺐다.</text>
<text class="ink3" x="20" y="1355" font-size="12.5">우리 앙상블은 모델 셋을 흔들기 셋으로 읽어 한 칸에 판독을 아홉 번 돈다. 크기로 견주려면 '단일 모델' 줄을 본다.</text>
<text class="ink3" x="20" y="1373" font-size="12.5">Tesseract 5 는 GPU 를 안 쓰는 엔진이라 GPU 칸이 비어 있다. 자르기(CPU)는 모두 같은 값이다 — 줄 자르기가 없는 상대에게는</text>
<text class="ink3" x="20" y="1391" font-size="12.5">우리 것을 빌려주었다. 장당 0.404초.</text>
