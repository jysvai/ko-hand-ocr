<text class="ink3" x="20" y="1240" font-size="12.5">우리 앙상블은 모델 셋을 흔들기 셋으로 읽어 한 칸에 판독을 아홉 번 돈다. 크기로 견주려면 '단일 모델' 줄을 본다.</text>
<text class="ink3" x="20" y="1258" font-size="12.5">Tesseract 5 는 GPU 를 안 쓰는 엔진이라 GPU 칸이 비어 있다. 자르기(CPU)는 모두 같은 값이다 — 줄 자르기가 없는 상대에게는</text>
<text class="ink3" x="20" y="1276" font-size="12.5">우리 것을 빌려주었다. 장당 0.435초.</text>
