<text class="ink3" x="20" y="836" font-size="12.5">사진은 우리 줄 자르기로 자른 같은 칸을 모두에게 넣었다. 글씨체 시험지는 합성 날것을 넣었다(저마다 제 전처리).</text>
<text class="ink3" x="20" y="854" font-size="12.5">시험 글꼴 여섯·스물네 벌은 우리 학습에서 뺀 것이다. 상대가 무엇을 보고 배웠는지는 모르므로 상대에게 불리하지 않다.</text>
<text class="ink3" x="20" y="872" font-size="12.5">상대는 모두 모델 카드의 사용법 그대로 돌렸다. 큰 VLM 은 욕심 뽑기(같은 그림이면 같은 답)로 읽혔다.</text>
