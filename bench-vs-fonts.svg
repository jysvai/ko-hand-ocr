<text class="ink3" x="20" y="978" font-size="12.5">'학습에 쓴 벌'은 우리 학습 자료다. 거기 점수가 높은 것은 일반화가 아니라 '배운 것을 외웠나'이고, ko-trocr 에게는 그냥 처음</text>
<text class="ink3" x="20" y="996" font-size="12.5">보는 글씨체다.</text>
<text class="ink3" x="20" y="1014" font-size="12.5">'고르기 6벌'은 학습에서 뺐지만 조합을 고르는 데 쓴다. '두루 24벌'은 학습에서도 빼고 고르기에도 안 쓴다 — 우리 쪽에서 가장</text>
<text class="ink3" x="20" y="1032" font-size="12.5">깨끗한 자리다.</text>
<text class="ink3" x="20" y="1050" font-size="12.5">세 무리를 한 숫자로 뭉개면 안 된다. 같은 시험이 아니다.</text>
